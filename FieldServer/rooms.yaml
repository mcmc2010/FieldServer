# FieldServer 配置
FieldServer:
  # 启动时创建的房间数量
  RoomCount: 128
  # 每个房间最大连接数
  MaxConnectionsPerRoom: 64
  # 每个连接的发送队列容量（队列长期满 = 慢消费者，断开以保护服务器）
  SendQueueCapacity: 1024
  # 单条消息最大字节数
  MaxMessageBytes: 4096
  # 对战配置（TeamSize=5 即 5v5）
  Battle:
    TeamSize: 5
    PlayerHp: 100
    AttackDamage: 20
  # 移动配置（场地为 [0, FieldWidth] x [0, FieldHeight] 的 2D 矩形）
  Movement:
    FieldWidth: 100
    FieldHeight: 100
    # 移动速度上限（单位/秒），超过视为瞬移并拒绝
    MoveSpeed: 10
    # 速度校验容差倍率（容忍客户端 tick 抖动）
    SpeedTolerance: 1.5
